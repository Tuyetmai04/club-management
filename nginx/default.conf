upstream spring_boot_app {
    server app:8080;
}

# HTTP Server (Container Port 80 -> Host Port 8081)
server {
    listen 80;
    server_name localhost;

    server_tokens off;
    client_max_body_size 20M;
    access_log /var/log/nginx/access.log;
    access_log /var/log/nginx_app/access.log;
    error_log /var/log/nginx/error.log warn;
    error_log /var/log/nginx_app/error.log warn;

    # Security Headers (always áp dụng cho mọi phản hồi kể cả mã lỗi)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    location / {
        proxy_pass http://spring_boot_app;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Host $http_host;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# HTTPS Server (Container Port 443 -> Host Port 8443)
server {
    listen 443 ssl;
    server_name localhost;

    # SSL Certificate & Private Key
    ssl_certificate /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;

    # Cấu hình giao thức & mã hóa SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    server_tokens off;
    client_max_body_size 20M;
    access_log /var/log/nginx/access.log;
    access_log /var/log/nginx_app/access.log;
    error_log /var/log/nginx/error.log warn;
    error_log /var/log/nginx_app/error.log warn;

    # Security Headers (always áp dụng cho mọi phản hồi kể cả mã lỗi)
    # Lưu ý: Không cấu hình HSTS (Strict-Transport-Security) cho môi trường chứng chỉ tự ký
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    location / {
        proxy_pass http://spring_boot_app;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Host $http_host;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
