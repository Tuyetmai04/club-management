# Application Name & Port
spring.application.name=club-management
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# MySQL Database Configuration
# Read from environment variables if present (Docker), fallback to local defaults without sensitive values
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/club_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:club_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.servlet.content-type=text/html

# Date Time Formatting
spring.mvc.format.date=yyyy-MM-dd
spring.mvc.format.date-time=yyyy-MM-dd'T'HH:mm

# Spring Boot Actuator & Prometheus Configuration
# Chi expose cac endpoint can thiet cho giam sat: health, prometheus, info, metrics
# Khong expose env, beans, configprops hoac cac endpoint nhay cam
management.endpoints.web.exposure.include=health,prometheus,info,metrics
management.endpoints.web.exposure.exclude=env,beans,configprops,mappings,threaddump,heapdump
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.endpoint.prometheus.enabled=true
management.metrics.tags.application=club-management

# Centralized Logging Configuration (ghi dong thoi ra file va console)
logging.file.name=${LOGGING_FILE_NAME:/app/logs/application.log}
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
logging.level.root=INFO
logging.level.com.clubmanagement=INFO
logging.level.org.springframework.web=INFO

