<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout('Thông báo Lỗi', ~{::content})}">
<body>
<div th:fragment="content">
    <div class="row justify-content-center py-5">
        <div class="col-12 col-md-6 text-center">
            <div class="card card-table p-5 bg-white shadow-sm">
                <div class="mb-3 text-danger">
                    <i class="fa-solid fa-triangle-exclamation fa-4x"></i>
                </div>
                <h4 class="fw-bold text-dark mb-2">Đã Xảy Ra Lỗi</h4>
                <p class="text-muted mb-4" th:text="${errorMessage}">Chi tiết lỗi không xác định.</p>
                <div>
                    <a th:href="@{/}" class="btn btn-primary rounded-pill px-4">
                        <i class="fa-solid fa-house me-1"></i> Trở về Trang chủ
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
