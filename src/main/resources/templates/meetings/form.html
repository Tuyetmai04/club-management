<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(${isEdit ? 'Chỉnh sửa Cuộc Họp' : 'Lên Lịch Cuộc Họp Mới'}, ~{::content})}">
<body>
<div th:fragment="content">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-9">
            <div class="card card-table p-4 bg-white">
                <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
                    <h5 class="m-0 text-info text-dark fw-bold">
                        <i class="fa-solid" th:classappend="${isEdit ? 'fa-calendar-pen' : 'fa-calendar-plus'}"></i>
                        <span th:text="${isEdit ? 'Cập nhật thông tin cuộc họp' : 'Tạo cuộc họp mới'}">Cuộc họp</span>
                    </h5>
                    <a th:href="@{/meetings}" class="btn btn-outline-secondary btn-sm">
                        <i class="fa-solid fa-arrow-left me-1"></i> Quay lại
                    </a>
                </div>

                <form th:action="@{/meetings/save}" th:object="${meeting}" method="post">
                    <input type="hidden" th:field="*{id}">

                    <div class="row g-3">
                        <!-- Mã cuộc họp -->
                        <div class="col-12 col-md-6">
                            <label for="meetingCode" class="form-label fw-bold">Mã cuộc họp <span class="text-danger">*</span></label>
                            <input type="text" th:field="*{meetingCode}" class="form-control" th:classappend="${#fields.hasErrors('meetingCode')} ? 'is-invalid' : ''" placeholder="VD: CH001">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('meetingCode')}" th:errors="*{meetingCode}">Lỗi mã cuộc họp</div>
                        </div>

                        <!-- Tên cuộc họp -->
                        <div class="col-12 col-md-6">
                            <label for="title" class="form-label fw-bold">Tên cuộc họp <span class="text-danger">*</span></label>
                            <input type="text" th:field="*{title}" class="form-control" th:classappend="${#fields.hasErrors('title')} ? 'is-invalid' : ''" placeholder="VD: Họp Ban chủ nhiệm tháng 10">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('title')}" th:errors="*{title}">Lỗi tên cuộc họp</div>
                        </div>

                        <!-- Hình thức họp -->
                        <div class="col-12 col-md-6">
                            <label for="format" class="form-label fw-bold">Hình thức họp <span class="text-danger">*</span></label>
                            <select th:field="*{format}" class="form-select" th:classappend="${#fields.hasErrors('format')} ? 'is-invalid' : ''">
                                <option value="Trực tiếp">Trực tiếp (Offline)</option>
                                <option value="Trực tuyến">Trực tuyến (Online)</option>
                            </select>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('format')}" th:errors="*{format}">Lỗi hình thức</div>
                        </div>

                        <!-- Địa điểm / Link -->
                        <div class="col-12 col-md-6">
                            <label for="location" class="form-label fw-bold">Địa điểm / Link cuộc họp <span class="text-danger">*</span></label>
                            <input type="text" th:field="*{location}" class="form-control" th:classappend="${#fields.hasErrors('location')} ? 'is-invalid' : ''" placeholder="VD: Phòng B201 hoặc meet.google.com/xyz">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('location')}" th:errors="*{location}">Lỗi địa điểm</div>
                        </div>

                        <!-- Ngày giờ họp -->
                        <div class="col-12 col-md-6">
                            <label for="meetingTime" class="form-label fw-bold">Thời gian diễn ra <span class="text-danger">*</span></label>
                            <input type="datetime-local" th:field="*{meetingTime}" class="form-control" th:classappend="${#fields.hasErrors('meetingTime')} ? 'is-invalid' : ''">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('meetingTime')}" th:errors="*{meetingTime}">Lỗi thời gian họp</div>
                        </div>

                        <!-- Người chủ trì -->
                        <div class="col-12 col-md-6">
                            <label for="host" class="form-label fw-bold">Người chủ trì <span class="text-danger">*</span></label>
                            <input type="text" th:field="*{host}" class="form-control" th:classappend="${#fields.hasErrors('host')} ? 'is-invalid' : ''" placeholder="VD: Nguyễn Văn A">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('host')}" th:errors="*{host}">Lỗi người chủ trì</div>
                        </div>

                        <!-- Nội dung / Biên bản cuộc họp -->
                        <div class="col-12">
                            <label for="content" class="form-label fw-bold">Nội dung / Chương trình họp</label>
                            <textarea th:field="*{content}" class="form-control" rows="4" placeholder="Nhập các mục thảo luận, ghi chú nội dung cuộc họp..."></textarea>
                        </div>
                    </div>

                    <div class="mt-4 pt-3 border-top text-end">
                        <a th:href="@{/meetings}" class="btn btn-light me-2">Hủy bỏ</a>
                        <button type="submit" class="btn btn-info px-4 text-dark fw-bold"><i class="fa-solid fa-save me-1"></i> Lưu cuộc họp</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
