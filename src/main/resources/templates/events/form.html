<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(${isEdit ? 'Chỉnh sửa Sự kiện' : 'Thêm mới Sự kiện'}, ~{::content})}">
<body>
<div th:fragment="content">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-9">
            <div class="card card-table p-4 bg-white">
                <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
                    <h5 class="m-0 text-success fw-bold">
                        <i class="fa-solid" th:classappend="${isEdit ? 'fa-calendar-pen' : 'fa-calendar-plus'}"></i>
                        <span th:text="${isEdit ? 'Cập nhật thông tin sự kiện' : 'Tạo sự kiện mới'}">Sự kiện</span>
                    </h5>
                    <a th:href="@{/events}" class="btn btn-outline-secondary btn-sm">
                        <i class="fa-solid fa-arrow-left me-1"></i> Quay lại
                    </a>
                </div>

                <form th:action="@{/events/save}" th:object="${event}" method="post">
                    <input type="hidden" th:field="*{id}">

                    <div class="row g-3">
                        <!-- Mã sự kiện -->
                        <div class="col-12 col-md-6">
                            <label for="eventCode" class="form-label fw-bold">Mã sự kiện <span class="text-danger">*</span></label>
                            <input type="text" th:field="*{eventCode}" class="form-control" th:classappend="${#fields.hasErrors('eventCode')} ? 'is-invalid' : ''" placeholder="VD: SK001">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('eventCode')}" th:errors="*{eventCode}">Lỗi mã sự kiện</div>
                        </div>

                        <!-- Tên sự kiện -->
                        <div class="col-12 col-md-6">
                            <label for="title" class="form-label fw-bold">Tên sự kiện <span class="text-danger">*</span></label>
                            <input type="text" th:field="*{title}" class="form-control" th:classappend="${#fields.hasErrors('title')} ? 'is-invalid' : ''" placeholder="VD: Chào tân sinh viên 2026">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('title')}" th:errors="*{title}">Lỗi tên sự kiện</div>
                        </div>

                        <!-- Thời gian bắt đầu -->
                        <div class="col-12 col-md-6">
                            <label for="startTime" class="form-label fw-bold">Thời gian bắt đầu <span class="text-danger">*</span></label>
                            <input type="datetime-local" th:field="*{startTime}" class="form-control" th:classappend="${#fields.hasErrors('startTime')} ? 'is-invalid' : ''">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('startTime')}" th:errors="*{startTime}">Lỗi thời gian bắt đầu</div>
                        </div>

                        <!-- Thời gian kết thúc -->
                        <div class="col-12 col-md-6">
                            <label for="endTime" class="form-label fw-bold">Thời gian kết thúc <span class="text-danger">*</span></label>
                            <input type="datetime-local" th:field="*{endTime}" class="form-control" th:classappend="${#fields.hasErrors('endTime')} ? 'is-invalid' : ''">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('endTime')}" th:errors="*{endTime}">Lỗi thời gian kết thúc</div>
                        </div>

                        <!-- Số lượng tham gia -->
                        <div class="col-12 col-md-4">
                            <label for="maxParticipants" class="form-label fw-bold">Số người dự kiến <span class="text-danger">*</span></label>
                            <input type="number" th:field="*{maxParticipants}" min="1" class="form-control" th:classappend="${#fields.hasErrors('maxParticipants')} ? 'is-invalid' : ''">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('maxParticipants')}" th:errors="*{maxParticipants}">Lỗi số người tham gia</div>
                        </div>

                        <!-- Người chủ trì -->
                        <div class="col-12 col-md-4">
                            <label for="host" class="form-label fw-bold">Người chủ trì <span class="text-danger">*</span></label>
                            <input type="text" th:field="*{host}" class="form-control" th:classappend="${#fields.hasErrors('host')} ? 'is-invalid' : ''" placeholder="VD: Nguyễn Văn A">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('host')}" th:errors="*{host}">Lỗi người chủ trì</div>
                        </div>

                        <!-- Địa điểm -->
                        <div class="col-12 col-md-4">
                            <label for="location" class="form-label fw-bold">Địa điểm <span class="text-danger">*</span></label>
                            <input type="text" th:field="*{location}" class="form-control" th:classappend="${#fields.hasErrors('location')} ? 'is-invalid' : ''" placeholder="VD: Hội trường A1">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('location')}" th:errors="*{location}">Lỗi địa điểm</div>
                        </div>

                        <!-- Mô tả -->
                        <div class="col-12">
                            <label for="description" class="form-label fw-bold">Mô tả nội dung sự kiện</label>
                            <textarea th:field="*{description}" class="form-control" rows="4" placeholder="Nhập chi tiết về chương trình, lịch trình sự kiện..."></textarea>
                        </div>
                    </div>

                    <div class="mt-4 pt-3 border-top text-end">
                        <a th:href="@{/events}" class="btn btn-light me-2">Hủy bỏ</a>
                        <button type="submit" class="btn btn-success px-4"><i class="fa-solid fa-save me-1"></i> Lưu sự kiện</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
