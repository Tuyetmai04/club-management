<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout('Chi tiết Sự kiện', ~{::content})}">
<body>
<div th:fragment="content">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-8">
            <div class="card card-table p-4 bg-white">
                <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
                    <h5 class="m-0 text-success fw-bold">
                        <i class="fa-solid fa-calendar-day me-2"></i> Thông tin Sự kiện
                    </h5>
                    <div>
                        <a th:href="@{/events/edit/{id}(id=${event.id})}" class="btn btn-warning btn-sm me-2">
                            <i class="fa-solid fa-pen-to-square me-1"></i> Chỉnh sửa
                        </a>
                        <a th:href="@{/events}" class="btn btn-outline-secondary btn-sm">
                            <i class="fa-solid fa-arrow-left me-1"></i> Quay lại
                        </a>
                    </div>
                </div>

                <div class="row g-3">
                    <div class="col-md-6">
                        <p class="text-muted small mb-1">Mã sự kiện</p>
                        <h6 class="fw-bold text-success" th:text="${event.eventCode}">SK001</h6>
                    </div>
                    <div class="col-md-6">
                        <p class="text-muted small mb-1">Trạng thái</p>
                        <span class="badge" th:classappend="${event.statusBadgeClass}" th:text="${event.statusText}">Sắp diễn ra</span>
                    </div>
                    <div class="col-12">
                        <p class="text-muted small mb-1">Tên sự kiện</p>
                        <h5 class="fw-bold text-dark" th:text="${event.title}">Tên sự kiện</h5>
                    </div>
                    <div class="col-md-6">
                        <p class="text-muted small mb-1">Thời gian bắt đầu</p>
                        <p class="fw-semibold text-primary" th:text="${#temporals.format(event.startTime, 'HH:mm - dd/MM/yyyy')}">08:00 - 01/01/2026</p>
                    </div>
                    <div class="col-md-6">
                        <p class="text-muted small mb-1">Thời gian kết thúc</p>
                        <p class="fw-semibold text-danger" th:text="${#temporals.format(event.endTime, 'HH:mm - dd/MM/yyyy')}">12:00 - 01/01/2026</p>
                    </div>
                    <div class="col-md-4">
                        <p class="text-muted small mb-1">Số người dự kiến</p>
                        <p class="fw-semibold" th:text="${event.maxParticipants} + ' người'">50 người</p>
                    </div>
                    <div class="col-md-4">
                        <p class="text-muted small mb-1">Người chủ trì</p>
                        <p class="fw-semibold" th:text="${event.host}">Nguyễn Văn A</p>
                    </div>
                    <div class="col-md-4">
                        <p class="text-muted small mb-1">Địa điểm</p>
                        <p class="fw-semibold" th:text="${event.location}">Hội trường A</p>
                    </div>
                    <div class="col-12">
                        <p class="text-muted small mb-1">Mô tả chi tiết</p>
                        <div class="p-3 bg-light rounded border" th:text="${event.description ?: 'Không có mô tả thêm'}">Mô tả</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
