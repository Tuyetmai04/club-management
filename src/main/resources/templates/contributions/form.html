<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(${isEdit ? 'Chỉnh sửa Khoản Đóng Góp' : 'Ghi Nhận Khoản Đóng Góp Mới'}, ~{::content})}">
<body>
<div th:fragment="content">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-9">
            <div class="card card-table p-4 bg-white">
                <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
                    <h5 class="m-0 text-warning text-dark fw-bold">
                        <i class="fa-solid" th:classappend="${isEdit ? 'fa-pen-to-square' : 'fa-hand-holding-dollar'}"></i>
                        <span th:text="${isEdit ? 'Cập nhật khoản đóng góp' : 'Ghi nhận đóng góp mới'}">Đóng góp</span>
                    </h5>
                    <a th:href="@{/contributions}" class="btn btn-outline-secondary btn-sm">
                        <i class="fa-solid fa-arrow-left me-1"></i> Quay lại
                    </a>
                </div>

                <form th:action="@{/contributions/save}" th:object="${contribution}" method="post">
                    <input type="hidden" th:field="*{id}">

                    <div class="row g-3">
                        <!-- Mã đóng góp -->
                        <div class="col-12 col-md-6">
                            <label for="contributionCode" class="form-label fw-bold">Mã đóng góp <span class="text-danger">*</span></label>
                            <input type="text" th:field="*{contributionCode}" class="form-control" th:classappend="${#fields.hasErrors('contributionCode')} ? 'is-invalid' : ''" placeholder="VD: DG001">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('contributionCode')}" th:errors="*{contributionCode}">Lỗi mã đóng góp</div>
                        </div>

                        <!-- Thành viên -->
                        <div class="col-12 col-md-6">
                            <label for="member" class="form-label fw-bold">Thành viên đóng góp <span class="text-danger">*</span></label>
                            <select th:field="*{member.id}" class="form-select" th:classappend="${#fields.hasErrors('member')} ? 'is-invalid' : ''">
                                <option value="">-- Chọn thành viên --</option>
                                <option th:each="m : ${members}" th:value="${m.id}" th:text="${m.fullName} + ' (' + ${m.memberCode} + ')'"></option>
                            </select>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('member')}" th:errors="*{member}">Vui lòng chọn thành viên</div>
                        </div>

                        <!-- Nội dung đóng góp -->
                        <div class="col-12 col-md-6">
                            <label for="title" class="form-label fw-bold">Nội dung đóng góp <span class="text-danger">*</span></label>
                            <input type="text" th:field="*{title}" class="form-control" th:classappend="${#fields.hasErrors('title')} ? 'is-invalid' : ''" placeholder="VD: Đóng quỹ tháng 10/2026">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('title')}" th:errors="*{title}">Lỗi nội dung đóng góp</div>
                        </div>

                        <!-- Số tiền -->
                        <div class="col-12 col-md-6">
                            <label for="amount" class="form-label fw-bold">Số tiền (VNĐ) <span class="text-danger">*</span></label>
                            <input type="number" step="1000" min="1000" th:field="*{amount}" class="form-control" th:classappend="${#fields.hasErrors('amount')} ? 'is-invalid' : ''" placeholder="VD: 100000">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('amount')}" th:errors="*{amount}">Lỗi số tiền</div>
                        </div>

                        <!-- Ngày đóng -->
                        <div class="col-12 col-md-6">
                            <label for="contributionDate" class="form-label fw-bold">Ngày đóng góp <span class="text-danger">*</span></label>
                            <input type="date" th:field="*{contributionDate}" class="form-control" th:classappend="${#fields.hasErrors('contributionDate')} ? 'is-invalid' : ''">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('contributionDate')}" th:errors="*{contributionDate}">Lỗi ngày đóng góp</div>
                        </div>

                        <!-- Người thu/nhận -->
                        <div class="col-12 col-md-6">
                            <label for="collector" class="form-label fw-bold">Người thu/nhận <span class="text-danger">*</span></label>
                            <input type="text" th:field="*{collector}" class="form-control" th:classappend="${#fields.hasErrors('collector')} ? 'is-invalid' : ''" placeholder="VD: Phạm Minh Tuấn">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('collector')}" th:errors="*{collector}">Lỗi người thu</div>
                        </div>

                        <!-- Ghi chú -->
                        <div class="col-12">
                            <label for="note" class="form-label fw-bold">Ghi chú thêm</label>
                            <textarea th:field="*{note}" class="form-control" rows="3" placeholder="Hình thức thanh toán (Tiền mặt, Chuyển khoản...), ghi chú hóa đơn..."></textarea>
                        </div>
                    </div>

                    <div class="mt-4 pt-3 border-top text-end">
                        <a th:href="@{/contributions}" class="btn btn-light me-2">Hủy bỏ</a>
                        <button type="submit" class="btn btn-warning px-4 text-dark fw-bold"><i class="fa-solid fa-save me-1"></i> Lưu thông tin</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
